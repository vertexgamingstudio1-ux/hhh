<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Gami Infinity — Roast Master</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background -->
    <div class="background-grid"></div>
    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>

    <!-- Main Game -->
    <main class="game-container">

        <!-- Header -->
        <header class="game-header">

            <div class="brand">
                <div class="brand-icon">G</div>

                <div>
                    <h1>GAMI INFINITY</h1>
                    <p>ROAST MASTER</p>
                </div>
            </div>

            <div class="game-stats">

                <div class="stat">
                    <span class="stat-label">SCORE</span>
                    <strong id="score">SCORE: 0</strong>
                </div>

                <div class="stat">
                    <span class="stat-label">MODE</span>
                    <strong>HARD</strong>
                </div>

            </div>

        </header>


        <!-- Progress -->
        <section class="progress-section">

            <div class="progress-info">
                <span id="level">
                    COMEBACK LAB • 1/3
                </span>

                <span class="difficulty">
                    🔥 HARD MODE
                </span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>

        </section>


        <!-- Arena -->
        <section class="arena">

            <div class="arena-top">

                <div class="round-badge">
                    ⚡ ROAST ARENA
                </div>

                <div class="rules">
                    THINK BEFORE YOU ROAST
                </div>

            </div>


            <!-- Question -->
            <div class="question-card">

                <div class="question-label">
                    SCENARIO
                </div>

                <div
                    id="question"
                    class="question"
                >
                    Loading challenge...
                </div>

            </div>


            <!-- Options -->
            <div
                id="options"
                class="options"
            >
                <!-- JavaScript inserts buttons -->
            </div>


            <!-- Result -->
            <div
                id="result"
                class="result"
            >
            </div>

        </section>


        <!-- Footer -->
        <footer class="game-footer">

            <span>
                GAMI INFINITY
            </span>

            <span>
                ROAST MASTER // HARD MODE
            </span>

        </footer>

    </main>


    <script src="game.js"></script>

</body>
</html>
