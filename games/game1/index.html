<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Gauntlet — Gami Infinity</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="game-shell">

        <header class="topbar">
            <div>
                <span class="brand">GAMI INFINITY</span>
                <h1>The Gauntlet</h1>
            </div>

            <div class="stats">
                <div>
                    <small>LEVEL</small>
                    <strong id="level">1 / 10</strong>
                </div>

                <div>
                    <small>SCORE</small>
                    <strong id="score">0</strong>
                </div>

                <div>
                    <small>LIVES</small>
                    <strong id="lives">❤️❤️❤️</strong>
                </div>
            </div>
        </header>

        <section class="game-card">

            <div class="progress">
                <div id="progressBar"></div>
            </div>

            <div class="question-area">
                <span class="level-label" id="levelLabel">LEVEL 1</span>

                <h2 id="question">
                    Loading challenge...
                </h2>

                <div id="answers" class="answers"></div>

                <p id="feedback"></p>
            </div>

            <button id="nextButton" class="next-button" hidden>
                NEXT LEVEL →
            </button>

        </section>

        <footer>
            <span>Gami Infinity</span>
            <span>10 levels • One Gauntlet</span>
        </footer>

    </main>

    <script src="game.js"></script>
</body>
</html>
